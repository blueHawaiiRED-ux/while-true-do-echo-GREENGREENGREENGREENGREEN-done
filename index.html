<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Green Console Loop</title>
</head>
<body>
    <h1></h1>

    <script>
        // 開発者ツールのコンソールに無限に文字をプリントし続けます
        // ※ブラウザがフリーズするのを防ぐため、ミリ秒単位のわずかな隙間（1ミリ秒）を空けて実行します
        setInterval(() => {
            console.log("GREENGREENGREENGREENGREEN");
        }, 1);
    </script>
</body>
</html>
