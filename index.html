<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>Random 500 Chars Loop</title>
</head>
<body>
    <h1>F12キーを押して「コンソール（Console）」を開いてください</h1>

    <script>
        // ランダムな500文字を生成する関数
        function generateRandomString() {
            const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
            let result = '';
            // ループ回数を 50 から 500 に変更
            for (let i = 0; i < 500; i++) {
                result += characters.charAt(Math.floor(Math.random() * characters.length));
            }
            return result;
        }

        // 1ミリ秒ごとにコンソールへ出力
        setInterval(() => {
            console.log(generateRandomString());
        }, 1);
    </script>
</body>
</html>
